name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runs_on:
        required: true
        type: choice
        default: 'self-hosted'
        options:
          - 'self-hosted'
          - 'ubuntu-latest'
        description: 'Runner'

jobs:
  test:
    name: test (dotnet)
    # The ReSharper test framework targets net472 and needs the .NET Framework
    # runtime, so these tests cannot run on the ubuntu runner used by `build`.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.x'

      # The ReSharper SDK drops its own NUnit3.TestAdapter.dll into the output
      # directory and it cannot be loaded by VSTest, shadowing the working one
      # from the NUnit3TestAdapter package. Point VSTest straight at the latter.
      - name: test
        shell: pwsh
        run: |
          $packages = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { Join-Path $env:USERPROFILE ".nuget\packages" }
          $adapter = Join-Path $packages "nunit3testadapter\4.6.0\build\net462"
          if (-not (Test-Path $adapter)) { throw "NUnit adapter not found at $adapter" }
          dotnet test src/dotnet/MediatorPlugin.Tests/MediatorPlugin.Tests.csproj `
            --test-adapter-path $adapter `
            --logger GitHubActions `
            --logger "trx;LogFileName=results.trx" `
            --results-directory "${{ github.workspace }}/testresults"

      # VSTest exits 0 when it discovers nothing, so a broken adapter would
      # otherwise report a green build that ran no tests at all.
      - name: assert tests actually ran
        shell: pwsh
        run: |
          $trx = Get-ChildItem "${{ github.workspace }}/testresults" -Filter *.trx -Recurse | Select-Object -First 1
          if (-not $trx) { throw "No .trx produced - the test run did not happen." }
          $counters = ([xml](Get-Content $trx.FullName)).TestRun.ResultSummary.Counters
          Write-Host "total=$($counters.total) executed=$($counters.executed) passed=$($counters.passed) failed=$($counters.failed)"
          if ([int]$counters.executed -lt 1) { throw "No tests were executed." }

  build:
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set version number
        run: |
          YEAR=$(date +'%y')
          MONTH=$(date +'%m')
          DAY=$(date +'%d')
          REV=$(printf "%02d" ${{ github.run_number }})
          VERSION="$YEAR.$MONTH.$DAY$REV"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT          
        shell: bash

      - name: update version (gradle & plugin.xml)
        shell: bash
        run: ./update-version.sh ${{ env.VERSION }}

      - name: install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.x'

      - name: install Java JDK
        uses: actions/setup-java@v6.0.0
        with:
          java-version: 17
          architecture: 'x64'
          distribution: 'oracle'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: build
        run: ./gradlew :prepareSandbox -PPluginVersion=${{ env.VERSION }}

      - name: setup rider plugin
        shell: bash
        run: |
          mkdir -p publish/rider/mediator/lib
          mkdir -p publish/rider/mediator/META-INF
          mkdir -p publish/rider/mediator/dotnet
          cp build/libs/mediatr-${{ env.VERSION }}.jar publish/rider/mediator/lib
          cp build/resources/main/META-INF/plugin.xml publish/rider/mediator/META-INF
          cp pluginIcon.svg publish/rider/mediator/META-INF
          cp src/dotnet/MediatorPlugin/bin/MediatorPlugin.Rider/Debug/MediatorPlugin.dll publish/rider/mediator/dotnet

      - name: publish rider plugin
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mediator.rider.${{ env.VERSION }}
          path: publish/rider

      - name: publish resharper plugin
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mediator.resharper.${{ env.VERSION }}
          path: src/dotnet/MediatorPlugin/bin/MediatorPlugin/Debug/*.nupkg
